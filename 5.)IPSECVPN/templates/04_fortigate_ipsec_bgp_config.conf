# ==============================================================================
# Fortinet FortiGate 40F (FortiOS 7.6.7 Mature) Configuration
# Lab 05: Hybrid Site-to-Site IPsec VPN & BGP Dynamic Routing to Azure
# Hostname: Rora-40F
# Author: Philippe Truong
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. IPsec Phase 1 Interface Configuration (IKEv2)
# ------------------------------------------------------------------------------
config vpn ipsec phase1-interface
    edit "40F_Azure_Tunn"
        set interface "wan"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dpd on-idle
        set dhgrp 14
        set remote-gw 4.157.90.69
        set psksecret "Testing123"
        set dpd-retryinterval 10
    next
end

# ------------------------------------------------------------------------------
# 2. IPsec Phase 2 Interface Configuration (Route-Based / 0.0.0.0/0 Selectors)
# ------------------------------------------------------------------------------
config vpn ipsec phase2-interface
    edit "azure-vpn-p2"
        set phase1name "40F_Azure_Tunn"
        set proposal aes256-sha256
        set dhgrp 14
        set auto-negotiate enable
        set keepalive enable
        set keylifeseconds 27000
    next
end

# ------------------------------------------------------------------------------
# 3. Tunnel Virtual Interface IP Addressing (Custom APIPA)
# ------------------------------------------------------------------------------
config system interface
    edit "40F_Azure_Tunn"
        set ip 169.254.21.1 255.255.255.255
        set allowaccess ping
        set type tunnel
        set remote-ip 169.254.21.2 255.255.255.252
        set interface "wan"
    next
end

# ------------------------------------------------------------------------------
# 4. Static Host Route for Azure BGP Peer APIPA Transport
# ------------------------------------------------------------------------------
config router static
    edit 0
        set dst 169.254.21.2 255.255.255.255
        set device "40F_Azure_Tunn"
        set comment "Azure VNG APIPA BGP Peer Transport Route"
    next
end

# ------------------------------------------------------------------------------
# 5. Bidirectional Firewall Security Policies
# ------------------------------------------------------------------------------
config firewall policy
    edit 0
        set name "LAN_TO_AZURE_TEST"
        set srcintf "vlan3_internal"
        set dstintf "40F_Azure_Tunn"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comment "Allow on-prem VLAN 3 to Azure Hub & Spokes over IPsec"
    next
    edit 0
        set name "Azure_to_LAN"
        set srcintf "40F_Azure_Tunn"
        set dstintf "vlan3_internal"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comment "Allow Azure Hub & Spokes to on-prem VLAN 3 over IPsec"
    next
end

# ------------------------------------------------------------------------------
# 6. BGP Routing Daemon Configuration (ASN 65001 <-> Azure ASN 65515)
# ------------------------------------------------------------------------------
config router bgp
    set as 65001
    set router-id 192.168.3.1
    config neighbor
        edit "169.254.21.2"
            set soft-reconfiguration enable
            set interface "40F_Azure_Tunn"
            set remote-as 65515
            set ebgp-enforce-multihop enable
        next
    end
    config network
        edit 1
            set prefix 192.168.3.0 255.255.255.0
        next
    end
end
